name: Comment Audit

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  public-content-comment-audit:
    runs-on: [self-hosted, linux, x64, feishu-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: false # This runner retains Go caches locally.
      - name: Post-publication comment audit
        run: |
          mkdir -p .tmp/comment-audit
          cp "$GITHUB_EVENT_PATH" .tmp/comment-audit/event.json
          go run ./internal/qualitygate/cmd/comment-audit --event .tmp/comment-audit/event.json --kind "$GITHUB_EVENT_NAME"
