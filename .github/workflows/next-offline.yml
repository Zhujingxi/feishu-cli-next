name: Next offline correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NEXT_BINARY: feishu-cli-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Preload public dependencies and locate caches
        id: dependencies
        run: |
          go mod download
          python - <<'PY'
          import os, subprocess
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for name in ('GOCACHE', 'GOMODCACHE'):
                  value = subprocess.check_output(['go', 'env', name], text=True).strip()
                  stream.write(name + '=' + value + '\n')
          PY
      - name: Build with committed API catalog
        id: build
        run: |
          go build -trimpath -o "$NEXT_BINARY" .
      - name: Compare configured-brand capability registrations
        id: capabilities
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.build.outcome == 'success' }}
        run: python scripts/next_inventory.py gate --target . --reference-dir baseline/v1.0.97 --mapping baseline/v1.0.97/next-interface-mapping.json.gz --out .tmp/next-ci/capabilities.json
      - name: Inventory, metadata, runner and workflow tests
        id: scripts
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python scripts/next_test.py --harness scripts --report .tmp/next-ci/scripts.json
      - name: Complete offline section suites
        id: sections
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python scripts/next_test.py --section all --suite all --binary "./$NEXT_BINARY" --report .tmp/next-ci/sections.json
      - name: Evaluation tooling unit and integration tests (no model calls)
        id: evaluation
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: python scripts/next_test.py --harness evaluation --report .tmp/next-ci/evaluation.json
      - name: Sheets to Base cross-domain suite
        id: integration
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python scripts/next_test.py --integration sheets_base --binary "./$NEXT_BINARY" --report .tmp/next-ci/integration.json
      - name: Record gate outcomes and evidence limits
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CAPABILITIES_OUTCOME: ${{ steps.capabilities.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
          SECTIONS_OUTCOME: ${{ steps.sections.outcome }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, platform
          root = pathlib.Path('.tmp/next-ci')
          root.mkdir(parents=True, exist_ok=True)
          stages = {name.lower(): os.environ.get(name + '_OUTCOME') or 'not_run'
                    for name in ('DEPENDENCIES', 'BUILD', 'CAPABILITIES', 'SCRIPTS', 'SECTIONS', 'EVALUATION', 'INTEGRATION')}
          (root / 'gate.json').write_text(json.dumps({
              'evidence': 'offline', 'purpose': 'software_correctness',
              'model_comparisons_executed': False, 'token_savings_measured': False,
              'platform': platform.system(), 'revision': os.environ['GITHUB_SHA'],
              'stages': stages, 'limits': [
                  'Capability reconciliation does not clear retained source review_required findings.',
                  'Skipped or blocked scenarios remain unverified; suite reports retain individual counts and reasons.',
                  'This gate runs on Linux only; macOS and Windows runtime behavior remain unverified by CI.',
                  'This gate does not run live APIs, real model comparisons, held-out trials, signing, or release publication.'
              ]}, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload all machine-readable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-offline-${{ runner.os }}-${{ github.sha }}
          path: .tmp/next-ci/
          if-no-files-found: error
          retention-days: 14
