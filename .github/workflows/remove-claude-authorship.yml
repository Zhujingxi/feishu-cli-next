name: Remove Claude co-authorship

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remove-claude-authorship-main
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Require an authorized bot token
        env:
          CLEANUP_TOKEN: ${{ secrets.CLAUDE_CLEANUP_TOKEN }}
        run: |
          if [ -z "$CLEANUP_TOKEN" ]; then
            echo '::error::Set CLAUDE_CLEANUP_TOKEN for a bot authorized to force-push main. See docs/author-cleanup.md.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_CLEANUP_TOKEN }}

      - name: Remove Claude trailers from main history
        shell: bash
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          after=$(python3 scripts/next_remove_claude_authorship.py "$before")
          if [ "$before" = "$after" ]; then
            echo 'No Claude co-author trailers found.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --exit-code "$before^{tree}" "$after^{tree}"
          printf 'Cleanup prepared: `%s` → `%s`.\n' "$before" "$after" >> "$GITHUB_STEP_SUMMARY"
          git push --force-with-lease="refs/heads/main:$before" origin "$after:refs/heads/main"
          echo 'Cleanup pushed; file contents are unchanged.' >> "$GITHUB_STEP_SUMMARY"
